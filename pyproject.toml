[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovanet"
version = "0.1.0"
description = "OvaNet AI: AI-assisted PCOS risk assessment from ovarian ultrasound (decision-support prototype)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "opencv-python",
    "Pillow",
    "torch",
    "shap",
    "streamlit",
    "reportlab",
]

[tool.setuptools.packages.find]
include = ["ovanet*"]